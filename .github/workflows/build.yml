name: Build

on:
  workflow_dispatch:        # ручной запуск: вкладка Actions → Build → Run workflow
  push:
    tags: ["v*"]            # git tag v0.1.0 && git push --tags

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --name DevAI --icon icon.ico --add-data "index.html;." --add-data "avatar.png;." devai.py
      - uses: actions/upload-artifact@v4
        with:
          name: DevAI-windows
          path: dist/DevAI.exe

  android-apk:
    runs-on: ubuntu-latest
    env:
      LLAMA_TAG: b11567
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Движок модели: llama.cpp (llama-server) под Android arm64. Собирается один раз и кешируется.
      - name: Cache llama.cpp engine
        id: engine
        uses: actions/cache@v4
        with:
          path: android/app/src/main/jniLibs
          key: llama-engine-${{ env.LLAMA_TAG }}-v1

      - name: Build llama.cpp engine for Android
        if: steps.engine.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}}"
          test -d "$NDK" || { echo "Android NDK не найден на раннере"; exit 1; }
          git clone --depth 1 --branch "$LLAMA_TAG" https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          cmake -S /tmp/llama.cpp -B /tmp/lbuild \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 -DANDROID_STL=c++_shared \
            -DBUILD_SHARED_LIBS=ON -DGGML_BACKEND_DL=ON -DGGML_CPU_ALL_VARIANTS=ON \
            -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DGGML_LLAMAFILE=OFF -DLLAMA_OPENSSL=OFF \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_UI=OFF -DLLAMA_USE_PREBUILT_UI=OFF
          cmake --build /tmp/lbuild --config Release -j"$(nproc)" --target llama-server
          OUT=android/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$OUT"
          cp /tmp/lbuild/bin/llama-server "$OUT/libllama_server.so"
          cp /tmp/lbuild/bin/*.so "$OUT/"
          STL="$(find "$NDK" -name libc++_shared.so -path '*aarch64-linux-android*' | head -n 1)"
          test -f "$STL" && cp "$STL" "$OUT/"
          ls -la "$OUT"
          ls "$OUT" | grep -q 'ggml-cpu' || { echo "Не найдены процессорные библиотеки ggml-cpu"; exit 1; }

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Bundle web UI into the app
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html avatar.png android/app/src/main/assets/
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon -PbuildNumber=${{ github.run_number }}
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk DevAI.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DevAI-android
          path: DevAI.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-exe, android-apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*

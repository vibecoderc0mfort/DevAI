<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#03040a" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#e8ecf5" media="(prefers-color-scheme: light)">
<title>DevAI</title>
<link rel="icon" href="avatar.png">
<style>
:root{
  color-scheme:light dark;
  --ease:cubic-bezier(.2,.8,.2,1);
  --bg:#e8ecf5; --ink:#07080c; --mute:#4b5262; --line:rgba(10,20,50,.12);
  --glass:rgba(255,255,255,.58); --glass2:rgba(255,255,255,.26);
  --edge:rgba(255,255,255,.9); --edge2:rgba(255,255,255,.45);
  --hi:rgba(255,255,255,.75); --panel:rgba(255,255,255,.42);
  --shadow:0 10px 32px rgba(30,45,90,.16);
  --inv-bg:rgba(8,10,16,.9); --inv-ink:#fff; --err:#b00020;
  --b1:rgba(90,120,255,.50); --b2:rgba(70,200,240,.46); --b3:rgba(180,130,255,.42);
  --sans:"SF Pro Display","Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Code",Consolas,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#03040a; --ink:#f5f7ff; --mute:#a3a9bb; --line:rgba(255,255,255,.12);
    --glass:rgba(255,255,255,.085); --glass2:rgba(255,255,255,.035);
    --edge:rgba(255,255,255,.26); --edge2:rgba(255,255,255,.09);
    --hi:rgba(255,255,255,.2); --panel:rgba(255,255,255,.06);
    --shadow:0 12px 36px rgba(0,0,0,.55);
    --inv-bg:rgba(255,255,255,.92); --inv-ink:#05060a; --err:#ff7b7b;
    --b1:rgba(60,90,255,.40); --b2:rgba(20,160,200,.28); --b3:rgba(130,80,240,.34);
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,select,textarea,input{font:inherit}
[hidden]{display:none!important}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button,select,.box,.starters button,.code-head button{transition:transform .28s var(--ease),background-color .25s,border-color .25s,box-shadow .25s,opacity .25s}
button:active:not(:disabled){transform:scale(.96)}

/* живой фон: медленно плывущие пятна света, их и размывает стекло */
.aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:var(--bg)}
.aurora i{position:absolute;width:75vmax;height:75vmax;border-radius:50%;will-change:transform}
.aurora i:nth-child(1){left:-22vmax;top:-26vmax;background:radial-gradient(circle,var(--b1),transparent 62%);animation:drift1 40s ease-in-out infinite alternate}
.aurora i:nth-child(2){right:-28vmax;top:18vmax;background:radial-gradient(circle,var(--b2),transparent 62%);animation:drift2 46s ease-in-out infinite alternate}
.aurora i:nth-child(3){left:-8vmax;bottom:-34vmax;background:radial-gradient(circle,var(--b3),transparent 62%);animation:drift3 52s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate3d(34vmax,22vmax,0) scale(1.15)}}
@keyframes drift2{to{transform:translate3d(-30vmax,-18vmax,0) scale(.92)}}
@keyframes drift3{to{transform:translate3d(26vmax,-26vmax,0) scale(1.2)}}

/* жидкое стекло: размытие, блик в углу, светлая кромка и мягкая тень */
.glass,.code,.note,.starters{
  position:relative;overflow:hidden;
  background:linear-gradient(145deg,var(--glass),var(--glass2));
  -webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%);
  border:1px solid var(--edge2);
  box-shadow:var(--shadow),inset 0 1px 0 var(--edge),inset 0 -1px 0 var(--edge2),inset 1px 0 0 var(--edge2);
}
.glass::before,.code::before,.note::before,.starters::before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(120% 90% at 0% 0%,var(--hi),transparent 46%);
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .glass,.code,.note,.starters{background:var(--bg)}
}

.top{position:absolute;top:0;left:0;right:0;z-index:5;pointer-events:none}
.top>*{pointer-events:auto}
.bar{width:calc(100% - 20px);max-width:780px;margin:8px auto 0}
.top>.bar:first-child{margin-top:calc(8px + env(safe-area-inset-top))}
header.bar{display:flex;align-items:center;gap:12px;padding:8px 14px;border-radius:24px}
.logo{width:32px;height:32px;border-radius:22%;display:block;flex:none;box-shadow:0 2px 10px rgba(0,0,0,.3)}
h1{margin:0;font-size:20px;font-weight:760;letter-spacing:-.03em;white-space:nowrap}
.ver{color:var(--mute);font-size:13px;font-weight:500;letter-spacing:0;margin-left:6px}
.status{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mute)}
.dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--ink);background:var(--ink);flex:none;transition:background-color .4s var(--ease)}
.dot.off{background:transparent}
select{font-size:14px;color:var(--ink);background:var(--panel);border:1px solid var(--edge2);border-radius:12px;padding:6px 8px;max-width:170px}
@media (max-width:440px){.ver,#stText{display:none}}

#banner{margin-bottom:0;padding:10px 14px;font-size:14px;border-radius:18px}
#banner:empty{display:none}
#banner code{font-family:var(--mono);font-size:.92em}
#keybox{padding:12px 14px;font-size:14px;border-radius:18px}
#keybox p{margin:0 0 8px}
.keyrow{display:flex;gap:8px}
.keyrow input{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--edge2);border-radius:12px;background:var(--panel);color:var(--ink)}
.keyrow button{border:0;border-radius:12px;background:var(--inv-bg);color:var(--inv-ink);padding:10px 14px;font-weight:600;cursor:pointer}

#chat{position:absolute;inset:0;z-index:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:96px 16px 150px}
.wrap{max-width:760px;margin:0 auto}

.empty{text-align:center;padding-top:1vh}
.empty img{width:84px;height:84px;border-radius:22%;box-shadow:0 16px 44px rgba(0,0,0,.35),0 0 0 1px var(--edge2)}
.empty h2{margin:20px 0 8px;font-size:clamp(28px,8vw,36px);line-height:1.1;font-weight:760;letter-spacing:-.035em}
.empty p{margin:0;color:var(--mute)}
.starters{margin:28px auto 0;max-width:460px;text-align:left;border-radius:22px}
.starters button{display:block;width:100%;border:0;background:none;color:var(--ink);padding:15px 18px;text-align:left;cursor:pointer;position:relative}
.starters button+button{border-top:1px solid var(--line)}
.starters button:hover{background:var(--panel)}

.msg{display:flex;gap:12px;margin:0 0 22px}
.msg.in{animation:rise .4s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}
.msg.user{justify-content:flex-end}
.msg.user .body{
  background:var(--inv-bg);color:var(--inv-ink);padding:10px 16px;border-radius:22px 22px 6px 22px;
  max-width:85%;white-space:pre-wrap;overflow-wrap:anywhere;
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.35);
}
.msg.assistant img{width:28px;height:28px;border-radius:22%;flex:none;margin-top:2px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.msg.assistant .body{flex:1;min-width:0;overflow-wrap:anywhere}
.body p{margin:0 0 .8em}
.body h3,.body h4,.body h5{margin:1.1em 0 .4em;line-height:1.25;letter-spacing:-.01em}
.body h3{font-size:1.3em}.body h4{font-size:1.15em}.body h5{font-size:1em}
.body ul,.body ol{margin:0 0 .8em;padding-left:1.4em}
.body a{color:inherit}
.body code{font-family:var(--mono);font-size:.9em;background:var(--panel);padding:.1em .35em;border-radius:6px}

.code{border-radius:16px;margin:.8em 0}
.code-head{position:relative;display:flex;justify-content:space-between;align-items:center;padding:6px 8px 6px 14px;border-bottom:1px solid var(--line);font-size:13px;color:var(--mute)}
.code-head button{color:var(--ink);background:var(--panel);border:1px solid var(--edge2);border-radius:10px;padding:2px 10px;font-size:13px;cursor:pointer}
.code pre{position:relative;margin:0;padding:14px;overflow-x:auto;font:13.5px/1.55 var(--mono);tab-size:4}
.code pre code{background:none;padding:0;font-size:inherit;border-radius:0}

.note{border-radius:14px;padding:10px 14px;color:var(--mute);font-size:14px;margin:0 0 .8em}
.note.err{color:var(--err);border-color:var(--err)}
.note code{font-family:var(--mono)}
details.src{margin:0 0 .8em;font-size:14px;color:var(--mute)}
details.src summary{cursor:pointer}
details.src ol{margin:.4em 0 0;padding-left:1.4em}

.bottom{position:absolute;left:0;right:0;bottom:0;z-index:5;padding:0 10px calc(10px + env(safe-area-inset-bottom));pointer-events:none}
.slab{pointer-events:auto;max-width:780px;margin:0 auto;border-radius:30px;padding:8px}
.box{position:relative;display:flex;align-items:flex-end;gap:8px;border-radius:24px;padding:6px 6px 6px 16px;background:var(--panel);border:1px solid var(--edge2)}
.box:focus-within{border-color:var(--edge);box-shadow:0 0 0 3px var(--edge2)}
textarea{flex:1;border:0;outline:0;resize:none;background:none;color:var(--ink);max-height:200px;padding:8px 0;line-height:1.45}
textarea::placeholder{color:var(--mute)}
#go{border:0;border-radius:18px;background:var(--inv-bg);color:var(--inv-ink);font-weight:600;padding:10px 16px;cursor:pointer;min-width:100px;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 14px rgba(0,0,0,.25)}
#go:disabled{opacity:.35;cursor:default}
.opts{position:relative;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;font-size:14px;color:var(--mute);padding:8px 8px 2px}
.opts label{display:flex;align-items:center;gap:6px;cursor:pointer}
.opts label.dis{opacity:.5;cursor:default}
.opts button{background:none;border:0;color:var(--mute);padding:0;cursor:pointer;text-decoration:underline}
.opts input{accent-color:var(--ink)}
.opts select{padding:4px 8px}

#devbox{padding:12px 14px;font-size:14px;border-radius:18px;max-height:min(52vh,430px);overflow-y:auto}
#devbox p{margin:0 0 8px}
#devbox .errtxt{color:var(--err);white-space:pre-wrap}
#devbox .mutetxt{color:var(--mute)}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.mrow small{display:block;color:var(--mute)}
.mrow button,.devrow button{border:1px solid var(--edge2);background:var(--panel);color:var(--ink);border-radius:12px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.mrow button.pri{background:var(--inv-bg);color:var(--inv-ink);border:0;font-weight:600}
.devrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.prog{position:relative;height:8px;border-radius:99px;background:var(--panel);overflow:hidden;margin:6px 0}
.prog>i{display:block;height:100%;width:0;background:var(--ink);border-radius:inherit;transition:width .6s var(--ease)}
.prog.ind>i{width:35%;animation:slide 1.5s var(--ease) infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(290%)}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>

<div class="top" id="top">
  <header class="glass bar">
    <img class="logo" src="avatar.png" alt="DevAI">
    <h1>DevAI<span class="ver">0.1 alpha</span></h1>
    <div class="status" id="status" title="">
      <span class="dot off" id="dot"></span><span id="stText">Проверяю сеть</span>
    </div>
    <select id="model" aria-label="Модель"></select>
  </header>

  <p id="banner" class="glass bar"></p>

  <div id="keybox" class="glass bar" hidden>
    <p>Облако использует бесплатные модели OpenRouter. Создайте бесплатный ключ на <b>openrouter.ai/keys</b> и вставьте его сюда. Ключ хранится только на этом устройстве.</p>
    <div class="keyrow">
      <input id="key" type="password" placeholder="sk-or-v1-..." autocomplete="off" autocapitalize="off" aria-label="Ключ OpenRouter">
      <button id="keysave">Сохранить</button>
    </div>
  </div>

  <div id="devbox" class="glass bar" hidden></div>
</div>

<main id="chat"><div class="wrap" id="wrap"></div></main>

<div class="bottom" id="bottom">
  <div class="slab glass">
    <div class="box">
      <textarea id="input" rows="1" placeholder="Опишите задачу" aria-label="Сообщение"></textarea>
      <button id="go">Отправить</button>
    </div>
    <div class="opts">
      <label id="modeLabel">Режим
        <select id="mode"><option value="local">Локально</option><option value="cloud">Облако</option></select>
      </label>
      <label id="webLabel"><input type="checkbox" id="web"> Искать в интернете</label>
      <button id="newChat">Новый чат</button>
      <button id="devtoggle" hidden>Модели</button>
      <button id="keyreset" hidden>Сменить ключ</button>
    </div>
  </div>
</div>

<script>

const $ = s => document.querySelector(s);
const chat = $('#chat'), wrap = $('#wrap'), input = $('#input'), go = $('#go'),
      web = $('#web'), webLabel = $('#webLabel'), modelSel = $('#model'),
      dot = $('#dot'), stText = $('#stText'), stBox = $('#status'), banner = $('#banner');

let messages = [], ctrl = null, busy = false, chatId = 0, currentTyper = null;
let status = {online:false, ollama:false, models:[], default:''};
let savedModel = '';
const KEY = 'devai.v1';

/* ---------- мини-рендер Markdown (без внешних библиотек, работает офлайн) ---------- */
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function inline(s){
  s = esc(s);
  s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s;
}

function textBlock(text){
  let out = '', list = null, para = [], m;
  const flush = () => { if(para.length){ out += '<p>' + inline(para.join(' ')) + '</p>'; para = []; } };
  const close = () => { if(list){ out += '</' + list + '>'; list = null; } };
  for(const ln of text.split('\n')){
    if(!ln.trim()){ flush(); close(); continue; }
    if((m = ln.match(/^(#{1,4})\s+(.*)/))){
      flush(); close();
      const n = Math.min(m[1].length + 2, 5);
      out += `<h${n}>${inline(m[2])}</h${n}>`; continue;
    }
    if((m = ln.match(/^\s*[-*]\s+(.*)/))){
      flush(); if(list !== 'ul'){ close(); out += '<ul>'; list = 'ul'; }
      out += '<li>' + inline(m[1]) + '</li>'; continue;
    }
    if((m = ln.match(/^\s*\d+[.)]\s+(.*)/))){
      flush(); if(list !== 'ol'){ close(); out += '<ol>'; list = 'ol'; }
      out += '<li>' + inline(m[1]) + '</li>'; continue;
    }
    close(); para.push(ln.trim());
  }
  flush(); close();
  return out;
}

function render(md){
  return md.split(/(```[\s\S]*?(?:```|$))/g).map(part => {
    if(part.startsWith('```')){
      const m = part.match(/^```([^\n`]*)\n?([\s\S]*?)(?:\n?```)?$/);
      const lang = esc((m[1] || '').trim() || 'код');
      return `<div class="code"><div class="code-head"><span>${lang}</span>` +
             `<button data-copy>Копировать</button></div><pre><code>${esc(m[2])}</code></pre></div>`;
    }
    return textBlock(part);
  }).join('');
}

/* ---------- сообщения ---------- */
const nearBottom = () => chat.scrollHeight - chat.scrollTop - chat.clientHeight < 120;
const toBottom = () => { chat.scrollTop = chat.scrollHeight; };
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const toBottomSmooth = () => {
  if(chat.scrollTo) chat.scrollTo({top: chat.scrollHeight, behavior: REDUCED ? 'auto' : 'smooth'});
  else toBottom();
};

function addMsg(role, text, animate){
  const root = document.createElement('div');
  root.className = 'msg ' + role + (animate && !REDUCED ? ' in' : '');
  const body = document.createElement('div');
  body.className = 'body';
  if(role === 'assistant'){
    const av = document.createElement('img');
    av.src = 'avatar.png'; av.alt = '';
    root.append(av);
    body.innerHTML = render(text);
  } else {
    body.textContent = text;
  }
  root.append(body);
  wrap.append(root);
  if(animate) toBottomSmooth(); else toBottom();
  return {root, body};
}

const STARTERS = [
  'Напиши Telegram-бота на Python, который напоминает о задачах',
  'Сделай калькулятор на HTML, CSS и JavaScript в одном файле',
  'Найди ошибку в моём коде и объясни, что не так',
];

function showEmpty(){
  wrap.innerHTML = `<div class="empty" id="empty">
    <img src="avatar.png" alt="">
    <h2>Что будем писать?</h2>
    <p>${emptyNote()}</p>
    <div class="starters"></div></div>`;
  const box = wrap.querySelector('.starters');
  for(const s of STARTERS){
    const b = document.createElement('button');
    b.textContent = s;
    b.onclick = () => send(s);
    box.append(b);
  }
}

/* ---------- режимы: локально (Ollama на компьютере) и облако (OpenRouter) ---------- */
const OR = 'https://openrouter.ai/api/v1';
const STANDALONE = location.protocol === 'file:';   // внутри приложения Android сервера нет
const SYSTEM = 'Ты DevAI — ИИ-помощник для разработки. Помогаешь писать, отлаживать, объяснять и улучшать код ' +
  'на любых языках и для любых платформ: приложения, сайты, боты, игры, скрипты, утилиты. ' +
  'Отвечай на языке пользователя. Сначала коротко скажи, что собираешься сделать, затем давай код целиком ' +
  'в блоках с указанием языка; для проекта из нескольких файлов перед каждым блоком пиши путь файла. ' +
  'Не сокращай код заглушками вроде «остальное без изменений». ' +
  'Если требований не хватает, сделай разумные допущения и перечисли их.';

const modeSel = $('#mode'), modeLabel = $('#modeLabel'), keybox = $('#keybox'),
      keyIn = $('#key'), keyBtn = $('#keysave'), keyReset = $('#keyreset');
const HAS_BRIDGE = !!window.DevAI;     // внутри приложения Android есть мост к встроенной модели
const MODES = [].concat(HAS_BRIDGE ? [['device', 'На телефоне']] : [], STANDALONE ? [] : [['local', 'Локально']], [['cloud', 'Облако']]);
let mode = MODES[0][0];
let prefs = {local:'', cloud:'', device:''};           // выбранная модель для каждого режима
let apiKey = '', freeModels = [], freeState = 'idle';   // idle | loading | ok | fail

function emptyNote(){
  if(mode === 'device') return 'Работает на этом телефоне: без интернета, без ключей и без лимитов.';
  return mode === 'cloud'
    ? 'Бесплатные облачные модели: нужны интернет и бесплатный ключ OpenRouter.'
    : 'Работает на вашем компьютере: без интернета и без лимитов на запросы.';
}

function save(){
  prefs[mode] = modelSel.value || prefs[mode];
  try{ localStorage.setItem(KEY, JSON.stringify({ver:2, messages, mode, prefs, web:web.checked})); }catch(e){}
}

function load(){
  try{
    const d = JSON.parse(localStorage.getItem(KEY) || '{}');
    messages = Array.isArray(d.messages) ? d.messages : [];
    if(d.prefs) prefs = Object.assign(prefs, d.prefs);
    if(d.mode && MODES.some(m => m[0] === d.mode) && (d.ver === 2 || !HAS_BRIDGE)) mode = d.mode;
    web.checked = !!d.web;
    apiKey = localStorage.getItem('devai.key') || '';
  }catch(e){}
  wrap.innerHTML = '';
  if(!messages.length) showEmpty();
  for(const m of messages) addMsg(m.role, m.content);
}

/* ---------- списки моделей ---------- */
function fillModels(items, want){
  modelSel.innerHTML = '';
  for(const it of items){
    const o = document.createElement('option'); o.value = it.id; o.textContent = it.label; modelSel.append(o);
  }
  if(!items.length){
    const o = document.createElement('option'); o.value = ''; o.textContent = 'нет моделей'; modelSel.append(o);
  }
  if(want && items.some(i => i.id === want)) modelSel.value = want;
}

function paintLocalModels(){
  const sig = 'L' + JSON.stringify(status.models);
  if(modelSel.dataset.sig === sig) return;
  const want = [prefs.local, status.default].find(n => n && status.models.includes(n));
  fillModels(status.models.map(n => ({id:n, label:n})), want);
  modelSel.dataset.sig = sig;
}

function paintCloudModels(){
  const sig = 'C' + freeModels.length;
  if(modelSel.dataset.sig === sig) return;
  fillModels(freeModels.map(m => ({id:m.id, label:m.name || m.id})), prefs.cloud);
  modelSel.dataset.sig = sig;
}

/* Бесплатные модели OpenRouter: список берётся у них при каждом запуске, ключ для него не нужен */
async function loadFree(){
  if(freeState === 'ok' || freeState === 'loading' || !status.online) return;
  freeState = 'loading';
  try{
    const r = await fetch(OR + '/models');
    const j = await r.json();
    const isCode = m => /coder|code/i.test(m.id) ? 1 : 0;
    freeModels = (j.data || []).filter(m =>
        m.pricing && Number(m.pricing.prompt) === 0 && Number(m.pricing.completion) === 0 &&
        (!m.architecture || !m.architecture.output_modalities || m.architecture.output_modalities.indexOf('text') >= 0))
      .sort((a, b) => (isCode(b) - isCode(a)) || ((b.created || 0) - (a.created || 0)));
    freeState = freeModels.length ? 'ok' : 'fail';
  }catch(e){ freeState = 'fail'; }
  if(mode === 'cloud') paintCloudModels();
  paintBanner();
}

/* ---------- статус ---------- */
function paintStatus(){
  if(mode === 'device'){
    const names = {ready:'Готово', starting:'Запуск', downloading:'Загрузка', importing:'Копирование', error:'Ошибка',
                   idle: dev.models.length ? 'Выберите модель' : 'Нет модели'};
    dot.classList.toggle('off', dev.state !== 'ready');
    stText.textContent = names[dev.state] || '';
    stBox.title = 'Модель работает на этом телефоне, интернет не нужен';
    web.disabled = true;
    return;
  }
  dot.classList.toggle('off', !status.online);
  stText.textContent = status.online ? 'Онлайн' : 'Офлайн';
  stBox.title = status.online ? 'Интернет есть' : 'Интернета нет: работают только локальные модели';
  web.disabled = !status.online;
  webLabel.classList.toggle('dis', !status.online);
}

function paintBanner(){
  if(mode === 'device'){ banner.textContent = ''; return; }
  if(mode === 'cloud'){
    if(!status.online) banner.textContent = 'Нет интернета: облачные модели недоступны.' + (STANDALONE ? '' : ' Переключитесь на «Локально».');
    else if(freeState === 'fail') banner.textContent = 'Не удалось загрузить список бесплатных моделей OpenRouter.';
    else banner.textContent = '';
    return;
  }
  if(!status.ollama){
    banner.innerHTML = 'Ollama не запущена. Установите её с <b>ollama.com</b>, запустите и обновите страницу.';
  } else if(!status.models.length){
    banner.innerHTML = 'Нет скачанных моделей. Выполните в терминале: <code>ollama pull ' + esc(status.default || 'qwen2.5-coder:7b') + '</code>';
  } else {
    banner.textContent = '';
  }
}

function applyMode(){
  modeSel.value = mode;
  modeLabel.hidden = MODES.length < 2;
  webLabel.hidden = mode !== 'local';
  keybox.hidden = !(mode === 'cloud' && !apiKey);
  keyReset.hidden = !(mode === 'cloud' && !!apiKey);
  devToggle.hidden = mode !== 'device';
  if(mode !== 'device') devbox.hidden = true;
  modelSel.dataset.sig = '';
  if(mode === 'cloud') paintCloudModels();
  else if(mode === 'local') paintLocalModels();
  else { readDev(); paintDevice(); }
  paintStatus(); paintBanner();
  const p = wrap.querySelector('#empty p');
  if(p) p.textContent = emptyNote();
}

async function refresh(){
  if(STANDALONE){
    status = {online:navigator.onLine, ollama:false, models:[], default:''};
  } else {
    try{ status = await (await fetch('/api/status')).json(); }
    catch(e){ status = {online:false, ollama:false, models:[], default:''}; }
  }
  paintStatus();
  if(mode === 'cloud') await loadFree(); else if(mode === 'local') paintLocalModels();
  paintBanner();
}

/* ---------- отправка ---------- */
function setBusy(v){
  busy = v;
  go.textContent = v ? 'Остановить' : 'Отправить';
  go.disabled = !v && !input.value.trim();
}

function explain(o){
  if(o.error === 'ollama_down') return 'Не удалось связаться с Ollama. Установите её с ollama.com и запустите.';
  if(o.error === 'model_missing') return `Модель «${o.model}» не скачана. Выполните в терминале: ollama pull ${o.model}`;
  if(o.error === 'cloud_key') return 'OpenRouter не принял ключ. Нажмите «Сменить ключ» и вставьте новый.';
  if(o.error === 'cloud_limit') return 'Достигнут лимит бесплатных запросов OpenRouter. Подождите минуту или выберите другую модель.';
  if(o.error === 'cloud_offline') return 'Нет связи с OpenRouter. Проверьте интернет.';
  if(o.error === 'cloud_http') return `OpenRouter вернул ошибку ${o.status}: ${o.detail || 'без пояснения'}. Попробуйте другую модель.`;
  if(o.error === 'device_down') return 'Модель на телефоне не отвечает. Откройте «Модели» и выберите её заново.';
  if(o.error === 'device_http') return `Модель вернула ошибку ${o.status}: ${o.detail || 'без пояснения'}. Возможно, переполнился контекст: начните новый чат.`;
  return 'Ошибка модели: ' + (o.detail || 'неизвестная ошибка');
}

async function streamLocal(model, msgs, useWeb, signal, onEvent){
  const r = await fetch('/api/chat', {
    method:'POST', headers:{'Content-Type':'application/json'}, signal,
    body: JSON.stringify({model, messages: msgs, web: useWeb}),
  });
  const reader = r.body.getReader(), dec = new TextDecoder();
  let buf = '';
  while(true){
    const {done, value} = await reader.read();
    if(done) break;
    buf += dec.decode(value, {stream:true});
    let i;
    while((i = buf.indexOf('\n')) >= 0){
      const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
      if(line) onEvent(JSON.parse(line));
    }
  }
}

async function streamOA(url, key, model, msgs, signal, onEvent, kind){
  let r;
  try{
    r = await fetch(url, {
      method:'POST', signal,
      headers:{'Content-Type':'application/json', 'Authorization':'Bearer ' + key},
      body: JSON.stringify({model, stream:true, messages:[{role:'system', content:SYSTEM}].concat(msgs)}),
    });
  }catch(e){
    if(e.name === 'AbortError') throw e;
    return onEvent({error: kind === 'cloud' ? 'cloud_offline' : 'device_down'});
  }
  if(!r.ok){
    let d = '';
    try{ const j = await r.json(); d = (j.error && j.error.message) || ''; }catch(e){}
    let code = 'device_http';
    if(kind === 'cloud') code = (r.status === 401 || r.status === 403) ? 'cloud_key' : r.status === 429 ? 'cloud_limit' : 'cloud_http';
    return onEvent({error:code, status:r.status, detail:d});
  }
  const reader = r.body.getReader(), dec = new TextDecoder();
  let buf = '';
  while(true){
    const {done, value} = await reader.read();
    if(done) return;
    buf += dec.decode(value, {stream:true});
    let i;
    while((i = buf.indexOf('\n')) >= 0){
      const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
      if(line.indexOf('data:') !== 0) continue;           // строки-комментарии SSE пропускаем
      const data = line.slice(5).trim();
      if(data === '[DONE]') return;
      let j; try{ j = JSON.parse(data); }catch(e){ continue; }
      if(j.error){ return onEvent({error: kind + '_http', status:j.error.code || '', detail:j.error.message || ''}); }
      const t = j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content;
      if(t) onEvent({message:{content:t}});
    }
  }
}

const streamCloud = (model, msgs, signal, onEvent) => streamOA(OR + '/chat/completions', apiKey, model, msgs, signal, onEvent, 'cloud');
const streamDevice = (msgs, signal, onEvent) =>
  streamOA('http://127.0.0.1:' + dev.port + '/v1/chat/completions', dev.key, 'local', trimHistory(msgs, DEV_HISTORY_CHARS), signal, onEvent, 'device');

async function send(text){
  text = (text || '').trim();
  if(!text || busy) return;
  if(mode === 'cloud' && !apiKey){
    if(!input.value) input.value = text;
    autosize(); keybox.hidden = false; keyIn.focus(); return;
  }
  if(mode === 'device'){
    readDev();
    if(dev.state !== 'ready'){
      if(!input.value) input.value = text;
      autosize();
      if(dev.state === 'idle' || dev.state === 'error') devOpen = true;
      devSig = ''; paintDevice();
      return;
    }
  }
  if(wrap.querySelector('#empty')) wrap.innerHTML = '';
  input.value = ''; autosize();

  messages.push({role:'user', content:text});
  const sid = chatId;
  const userEl = addMsg('user', text, true);
  const asEl = addMsg('assistant', '', true);
  const notes = document.createElement('div');
  const out = document.createElement('div');
  asEl.body.append(notes, out);
  const typer = makeTyper(out);
  currentTyper = typer;

  let acc = '', failed = false;
  ctrl = new AbortController();
  setBusy(true);

  const note = (html, err) => {
    const d = document.createElement('div');
    d.className = 'note' + (err ? ' err' : '');
    d.innerHTML = html; notes.append(d);
  };

  const onEvent = o => {
    const stick = nearBottom();
    if(o.error){ failed = true; note(esc(explain(o)), true); }
    else if(o.devai === 'offline') note('Интернета нет, отвечаю без поиска.');
    else if(o.devai === 'search_failed') note('Поиск не сработал, отвечаю без него.');
    else if(o.devai === 'sources'){
      const d = document.createElement('details'); d.className = 'src';
      d.innerHTML = `<summary>Источники из интернета (${o.results.length})</summary><ol>` +
        o.results.map(s => `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a></li>`).join('') + '</ol>';
      notes.append(d);
    }
    else if(o.message && o.message.content){
      acc += o.message.content;
      typer.push(o.message.content);
    }
    if(stick) toBottom();
  };

  try{
    if(mode === 'cloud') await streamCloud(modelSel.value, messages, ctrl.signal, onEvent);
    else if(mode === 'device') await streamDevice(messages, ctrl.signal, onEvent);
    else await streamLocal(modelSel.value, messages, web.checked && status.online, ctrl.signal, onEvent);
  }catch(e){
    if(e.name !== 'AbortError'){ failed = true; note('Связь с DevAI потеряна. Проверьте, что devai.py запущен.', true); }
    else typer.flush();
  }finally{
    await typer.finish();
    ctrl = null; currentTyper = null;
    if(sid !== chatId){ setBusy(false); return; }   // чат сбросили, пока шёл ответ
    if(acc){
      messages.push({role:'assistant', content:acc});
    } else if(failed){
      messages.pop();                       // ответа нет: возвращаем текст в поле ввода
      if(!input.value) input.value = text;
      autosize();
    } else {
      messages.pop(); userEl.root.remove(); asEl.root.remove();
      if(!messages.length) showEmpty();
    }
    setBusy(false);
    save();
  }
}

/* ---------- режим «На телефоне»: модель работает внутри приложения, интернет и ключи не нужны ---------- */
const devbox = $('#devbox'), devToggle = $('#devtoggle');
let dev = {state:'idle', message:'', models:[], catalog:[], ramMb:0, freeMb:0, done:0, total:-1, active:'', port:0, key:''};
let devOpen = false, devSig = '', devPrev = 'idle';
const DEV_HISTORY_CHARS = 14000;      // контекст у модели на телефоне ограничен, старые сообщения отбрасываем
const fmtBytes = b => b >= 1073741824 ? (b / 1073741824).toFixed(1) + ' ГБ' : Math.max(1, Math.round(b / 1048576)) + ' МБ';
const baseName = f => f.replace(/\.gguf$/i, '');
const attr = s => esc(String(s)).replace(/"/g, '&quot;');

function readDev(){
  try{ dev = Object.assign(dev, JSON.parse(window.DevAI.status())); }catch(e){}
}

function recommended(){               // какую модель предложить, исходя из памяти телефона
  const r = dev.ramMb || 0;
  return r >= 5500 ? 'coder-3b' : r >= 3000 ? 'coder-1.5b' : 'coder-0.5b';
}

function devVisible(){
  return devOpen || !dev.models.length || ['downloading', 'importing', 'starting', 'error'].indexOf(dev.state) >= 0;
}

function devHTML(){
  if(dev.state === 'downloading' || dev.state === 'importing'){
    return `<p><b>${dev.state === 'downloading' ? 'Скачиваю модель' : 'Копирую модель'}</b></p>
      <div class="prog"><i id="devbar"></i></div><p class="mutetxt" id="devpct"></p>
      <div class="devrow"><button data-act="cancel">Остановить</button></div>`;
  }
  let h = '';
  if(dev.state === 'starting') h += '<p><b>Загружаю модель в память</b><br><span class="mutetxt">Это может занять до минуты.</span></p><div class="prog ind"><i></i></div>';
  if(dev.state === 'error') h += `<p class="errtxt">${esc(dev.message)}</p>`;
  else if(dev.message) h += `<p class="mutetxt">${esc(dev.message)}</p>`;
  if(!dev.models.length){
    h += '<p>Чтобы работать на телефоне, скачайте модель один раз (лучше по Wi-Fi). Потом интернет не понадобится.</p>';
  } else {
    h += '<p><b>Ваши модели</b></p>';
    for(const m of dev.models){
      const act = m.file === dev.active;
      h += `<div class="mrow"><div>${esc(baseName(m.file))}<small>${fmtBytes(m.size)}${act ? ', сейчас используется' : ''}</small></div>` +
        `<div class="devrow" style="margin:0">` +
        (act ? '' : `<button class="pri" data-act="use" data-file="${attr(m.file)}">Выбрать</button>`) +
        `<button data-act="rm" data-file="${attr(m.file)}">Удалить</button></div></div>`;
    }
  }
  const have = new Set(dev.models.map(m => m.file));
  const rest = dev.catalog.filter(c => !have.has(c.file));
  if(rest.length){
    h += '<p style="margin-top:10px"><b>Скачать модель</b></p>';
    for(const c of rest){
      h += `<div class="mrow"><div>${esc(c.name)}<small>${esc(c.size)}${c.id === recommended() ? ', подходит вашему телефону' : ''}</small></div>` +
        `<button class="pri" data-act="dl" data-id="${attr(c.id)}">Скачать</button></div>`;
    }
  }
  h += `<div class="devrow"><button data-act="import">Выбрать свой файл .gguf</button>${dev.models.length ? '<button data-act="close">Закрыть</button>' : ''}</div>`;
  h += '<p class="mutetxt" style="margin:8px 0 0">Подойдёт любая модель в формате GGUF, например с huggingface.co.</p>';
  return h;
}

function paintDeviceModels(){
  const sig = 'D' + dev.active + JSON.stringify(dev.models);
  if(modelSel.dataset.sig === sig) return;
  fillModels(dev.models.map(m => ({id:m.file, label:baseName(m.file)})), dev.active || prefs.device);
  modelSel.dataset.sig = sig;
}

function paintDevice(){
  if(mode !== 'device') return;
  if(dev.state === 'ready' && devPrev !== 'ready') devOpen = false;   // модель запустилась: прячем панель
  devPrev = dev.state;
  const show = devVisible();
  devbox.hidden = !show;
  const sig = [dev.state, dev.message, dev.active, JSON.stringify(dev.models), devOpen, dev.catalog.length, recommended()].join('|');
  if(show && sig !== devSig){ devbox.innerHTML = devHTML(); devSig = sig; }
  if(show && (dev.state === 'downloading' || dev.state === 'importing')){
    const bar = $('#devbar'), pct = $('#devpct');
    if(bar && pct){
      const known = dev.total > 0;
      bar.style.width = known ? Math.min(100, dev.done / dev.total * 100).toFixed(1) + '%' : '35%';
      pct.textContent = known ? fmtBytes(dev.done) + ' из ' + fmtBytes(dev.total) : fmtBytes(dev.done);
    }
  }
  paintDeviceModels();
  paintStatus();
}

devbox.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if(!b || !window.DevAI) return;
  const act = b.dataset.act;
  if(act === 'dl') window.DevAI.download(b.dataset.id);
  else if(act === 'use'){ window.DevAI.use(b.dataset.file); prefs.device = b.dataset.file; devOpen = false; save(); }
  else if(act === 'rm'){
    if(b.dataset.sure !== '1'){ b.dataset.sure = '1'; b.textContent = 'Точно удалить?'; return; }
    window.DevAI.remove(b.dataset.file);
  }
  else if(act === 'import') window.DevAI.importModel();
  else if(act === 'cancel') window.DevAI.cancel();
  else if(act === 'close') devOpen = false;
  readDev(); devSig = ''; paintDevice();
});
devToggle.addEventListener('click', () => { devOpen = !devOpen; devSig = ''; paintDevice(); });

function trimHistory(msgs, max){
  let total = 0;
  const out = [];
  for(let i = msgs.length - 1; i >= 0; i--){
    total += msgs[i].content.length;
    if(total > max && out.length) break;
    out.unshift(msgs[i]);
  }
  while(out.length > 1 && out[0].role !== 'user') out.shift();
  return out;
}

function buildModes(){
  modeSel.innerHTML = '';
  for(const m of MODES){
    const o = document.createElement('option'); o.value = m[0]; o.textContent = m[1]; modeSel.append(o);
  }
}

/* ---------- плавная печать: ответ приходит кусками, а показывается ровным потоком ---------- */
function makeTyper(el){
  let shown = 0, full = '', raf = 0, done = null;
  const paint = () => {
    const stick = nearBottom();
    el.innerHTML = render(full.slice(0, shown));
    if(stick) toBottom();
  };
  const step = () => {
    raf = 0;
    const left = full.length - shown;
    if(left > 0){
      shown += REDUCED ? left : Math.max(2, Math.ceil(left / 14));
      const c = full.charCodeAt(shown - 1);
      if(c >= 0xD800 && c <= 0xDBFF) shown++;       // не режем эмодзи пополам
      shown = Math.min(shown, full.length);
      paint();
    }
    if(shown < full.length) raf = requestAnimationFrame(step);
    else if(done){ const d = done; done = null; d(); }
  };
  return {
    push(t){ full += t; if(!raf) raf = requestAnimationFrame(step); },
    finish(){ return new Promise(res => { if(shown >= full.length) return res(); done = res; if(!raf) raf = requestAnimationFrame(step); }); },
    flush(){
      if(raf){ cancelAnimationFrame(raf); raf = 0; }
      shown = full.length; paint();
      if(done){ const d = done; done = null; d(); }
    },
  };
}

/* ---------- ввод ---------- */
function autosize(){
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 200) + 'px';
  if(!busy) go.disabled = !input.value.trim();
}
input.addEventListener('input', autosize);
input.addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey && matchMedia('(pointer:fine)').matches && !e.isComposing){
    e.preventDefault(); send(input.value);
  }
});
go.addEventListener('click', () => {
  if(!busy) return send(input.value);
  if(ctrl) ctrl.abort();
  if(currentTyper) currentTyper.flush();
});
$('#newChat').addEventListener('click', () => {
  if(ctrl) ctrl.abort();
  if(currentTyper) currentTyper.flush();
  chatId++; messages = []; showEmpty(); save();
});
web.addEventListener('change', save);
modelSel.addEventListener('change', () => {
  if(mode === 'device' && modelSel.value && window.DevAI && modelSel.value !== dev.active) window.DevAI.use(modelSel.value);
  save();
});

modeSel.addEventListener('change', () => {
  prefs[mode] = modelSel.value;
  mode = modeSel.value;
  applyMode(); refresh(); save();
});
keyBtn.addEventListener('click', () => {
  const k = keyIn.value.trim();
  if(!k) return;
  apiKey = k; keyIn.value = '';
  try{ localStorage.setItem('devai.key', k); }catch(e){}
  applyMode();
});
keyIn.addEventListener('keydown', e => { if(e.key === 'Enter') keyBtn.click(); });
keyReset.addEventListener('click', () => {
  apiKey = '';
  try{ localStorage.removeItem('devai.key'); }catch(e){}
  applyMode(); keyIn.focus();
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-copy]');
  if(!b) return;
  const text = b.closest('.code').querySelector('code').textContent;
  const done = () => { b.textContent = 'Скопировано'; setTimeout(() => b.textContent = 'Копировать', 1500); };
  if(navigator.clipboard) navigator.clipboard.writeText(text).then(done, () => {});
  else { const t = document.createElement('textarea'); t.value = text; document.body.append(t); t.select(); document.execCommand('copy'); t.remove(); done(); }
});

const topEl = $('#top'), botEl = $('#bottom');
function layout(){
  chat.style.paddingTop = (topEl.offsetHeight + 16) + 'px';
  chat.style.paddingBottom = (botEl.offsetHeight + 16) + 'px';
}
if(window.ResizeObserver){ const ro = new ResizeObserver(layout); ro.observe(topEl); ro.observe(botEl); }
addEventListener('resize', layout);

buildModes(); load(); applyMode(); setBusy(false); autosize(); layout();
refresh(); setInterval(refresh, 10000);
setInterval(() => { if(mode === 'device'){ readDev(); paintDevice(); } }, 800);
</script>
